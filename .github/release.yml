# Configuration for automatic GitHub Release notes generation
# Documentation: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
    categories:
        - title: '🚀 Features & Enhancements'
          labels:
              - 'enhancement'
              - 'feature'
              - 'feat'
        - title: '🐛 Bug Fixes'
          labels:
              - 'bug'
              - 'fix'
              - 'hotfix'
        - title: '⚡ Performance Improvements'
          labels:
              - 'performance'
              - 'perf'
        - title: '📚 Documentation'
          labels:
              - 'documentation'
              - 'docs'
        - title: '🔧 Maintenance & Dependencies'
          labels:
              - 'dependencies'
              - 'chore'
              - 'ci'
              - 'build'
              - 'refactor'
              - 'test'
