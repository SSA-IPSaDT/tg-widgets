name: Publish to npm & JSR

on:
    release:
        types: [published]
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish-npm:
        name: Publish to npm Registry
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Run verification checks
              run: bun run check && bun test

            - name: Build package
              run: bun run build

            - name: Authenticate & Publish to npm
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
                  bun publish --access public

    publish-jsr:
        name: Publish to JSR
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Publish to JSR
              run: npx jsr publish --allow-slow-types
