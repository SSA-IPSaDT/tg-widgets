name: CI

on:
    push:
        branches: [main, 'feat/**', 'fix/**']
    pull_request:
        branches: [main]

jobs:
    test:
        name: Lint, Build, Test & Validate 4096B Ceilings
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install

            - name: Verify code formatting (Prettier)
              run: bun run format:check

            - name: Type check (tsc --noEmit)
              run: bun run check

            - name: Build bundles & types
              run: bun run build

            - name: Run unit & integration tests
              run: bun test

            - name: Verify Telegram 4096B deflate limits for all example screens
              run: bun run check:compression
